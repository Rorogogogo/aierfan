name: Publish to Chrome Web Store

# On a version tag (v*), builds the extension zip and publishes it to the Chrome
# Web Store via the CWS API, authenticating with an OAuth refresh token.
#
# Requires three repository SECRETS and one repository VARIABLE:
#   secret CWS_CLIENT_ID       OAuth client id      (Google Cloud > Credentials)
#   secret CWS_CLIENT_SECRET   OAuth client secret
#   secret CWS_REFRESH_TOKEN   refresh token        (scripts/cws-get-refresh-token.mjs)
#   var    CWS_ITEM_ID         the extension's item id (from the dev console URL)
#
# Without CWS_ITEM_ID set, the job is skipped (so the repo is safe before setup).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.CWS_ITEM_ID != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

      - name: Build extension zip
        run: |
          cd extension
          zip -r ../upload.zip . -x '*.DS_Store'
          cd ..
          ls -l upload.zip

      - name: Get access token
        id: token
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          resp=$(curl -sS --fail-with-body -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token)
          token=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "::error::Could not get an access token. Response: $(echo "$resp" | jq -r '.error // .')"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Upload new package
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: |
          resp=$(curl -sS --fail-with-body -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -T upload.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$ITEM_ID")
          echo "$resp" | jq '{uploadState, itemError}' 2>/dev/null || echo "$resp"
          state=$(echo "$resp" | jq -r '.uploadState // empty')
          if [ "$state" = "FAILURE" ]; then
            echo "::error::Upload rejected: $(echo "$resp" | jq -c '.itemError')"
            exit 1
          fi

      - name: Publish
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: |
          resp=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$ITEM_ID/publish")
          echo "$resp"
          status=$(echo "$resp" | jq -r '.status[0] // "UNKNOWN"')
          echo "::notice::Chrome Web Store publish status: $status"
          # OK = live rollout started; a review-pending status is also a success here.
          case "$status" in
            OK|ITEM_PENDING_REVIEW|PUBLISHED_WITH_FRICTION_WARNING) : ;;
            *) echo "::error::Publish returned: $(echo "$resp" | jq -c '.')"; exit 1 ;;
          esac
