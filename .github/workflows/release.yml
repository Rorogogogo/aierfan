name: Release

# Push a version tag (e.g. v0.1.0) to cut a release: the suite runs, the extension is
# zipped, and a GitHub Release is published with the zip attached and auto-generated notes.
# Uses the built-in GITHUB_TOKEN only — no secrets to configure.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Build extension zip
        run: |
          name="aierfan-${GITHUB_REF_NAME}.zip"
          cd extension
          zip -r "../$name" . -x '*.DS_Store'
          cd ..
          ls -l "$name"
          echo "ZIP_NAME=$name" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
